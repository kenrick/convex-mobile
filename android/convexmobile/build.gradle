import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias(libs.plugins.rust.android.gradle)
    alias(libs.plugins.android.library)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.kotlin.serialization)
    id 'maven-publish'
    id 'signing'
}

// Controls the version for Maven packaging and how the client identifies itself in requests.
// harby's fork publishes fixed versions (see HARBY-PATCHES.md) instead of deriving one from git tags.
def libraryVersion = '0.8.1-harby.1'

android {
    namespace 'dev.convex.android'
    compileSdk 36

    ndkVersion = "27.3.13750724"

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdk 26
        buildConfigField 'String', 'LIBRARY_VERSION', "\"${libraryVersion}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        // android.util.Log is called on paths the JVM unit tests exercise.
        unitTests.returnDefaultValues = true
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    // The UniFFI bindings, generated per variant (see below); declared here so the sources jar
    // includes them too.
    sourceSets {
        debug.java.srcDir layout.buildDirectory.dir('generated/source/uniffi/debug/java').get().asFile
        release.java.srcDir layout.buildDirectory.dir('generated/source/uniffi/release/java').get().asFile
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
    }
}

cargo {
    module = "../../rust"
    libname = "convexmobile"
    targets = ["arm64", "arm", "x86_64"]
    profile = "release"
    extraCargoBuildArguments = ['--locked']
    pythonCommand = "python3"
    // The plugin links with 16 KB page alignment itself (for NDK <= 27):
    // https://developer.android.com/guide/practices/page-sizes#other-build-systems

    exec { spec, toolchain ->
        // Required env vars for aws-lc-rs to compile its aws-lc dependency w/ CMake.
        def ndkRoot = new File(android.sdkDirectory, "ndk/${android.ndkVersion}")
        def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
        def hostTag = osName.contains("windows") ? "windows-x86_64" :
                      osName.contains("linux") ? "linux-x86_64" :
                      osName.contains("mac") ? "darwin-x86_64" :
                      "linux-x86_64" // Default
        def sysroot = new File(ndkRoot, "toolchains/llvm/prebuilt/${hostTag}/sysroot")
        spec.environment('ANDROID_NDK_ROOT', ndkRoot.absolutePath)
        spec.environment('BINDGEN_EXTRA_CLANG_ARGS', "--sysroot ${sysroot.absolutePath}")

        // Keep build-machine paths out of the shipped library (panic and log messages embed source
        // paths), as rust/build-ios.sh does.
        def cargoHome = System.getenv('CARGO_HOME') ?: "${System.getProperty('user.home')}/.cargo"
        def rustDir = file('../../rust').canonicalPath
        def rustSysroot = providers.exec { commandLine 'rustc', '--print', 'sysroot' }.standardOutput.asText.get().trim()
        spec.environment('RUSTFLAGS', "--remap-path-prefix=${cargoHome}=/cargo --remap-path-prefix=${rustSysroot}=/rust --remap-path-prefix=${rustDir}=/convex-mobile/rust")
        spec.environment('AWS_LC_SYS_CFLAGS', "-ffile-prefix-map=${cargoHome}=/cargo -ffile-prefix-map=${rustDir}=/convex-mobile/rust")
    }
}

tasks.whenTaskAdded { task ->
    if ((task.name == 'generateDebugUniFFIBindings' || task.name == 'generateReleaseUniFFIBindings')) {
        task.dependsOn 'cargoBuild'
    }
    if (task.name == 'compileDebugKotlin') {
        task.dependsOn 'generateDebugUniFFIBindings'
    } else if (task.name == 'compileReleaseKotlin' || task.name == 'sourceReleaseJar') {
        task.dependsOn 'generateReleaseUniFFIBindings'
    }
}

tasks.register("generateUniFFIBinary", Exec) {
    workingDir "${project.projectDir}/../../rust"
    commandLine 'cargo'
    args 'build', '--locked', '--bin', 'uniffi-bindgen', '--no-default-features', '--features=uniffi/cli'
}

android.libraryVariants.all { variant ->
    def t = tasks.register("generate${variant.name.capitalize()}UniFFIBindings", Exec) {
        workingDir "${project.projectDir}/../../rust"
        commandLine 'cargo', 'run', '--locked', '--bin', 'uniffi-bindgen', '--no-default-features', '--features=uniffi/cli', '--', 'generate', '--library', "${project.layout.buildDirectory.asFile.get().path}/rustJniLibs/android/arm64-v8a/libconvexmobile.so", '--language', 'kotlin', '--out-dir', "${project.layout.buildDirectory.asFile.get().path}/generated/source/uniffi/${variant.name}/java"
        dependsOn 'generateUniFFIBinary'
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'dev.convex'
            artifactId = 'android-convexmobile'
            version = libraryVersion
            pom {
                name = 'Convex for Android'
                description = 'Android client library for building apps with convex.dev, with harby\'s patches (HARBY-PATCHES.md)'
                url = 'https://github.com/kenrick/convex-mobile'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        name = 'Christian Wyglendowski'
                        email = 'christian@convex.dev'
                        organization = 'Convex, Inc.'
                        organizationUrl = 'https://www.convex.dev/'
                    }
                    developer {
                        name = 'Nipunn Koorapati'
                        email = 'nipunn@convex.dev'
                        organization = 'Convex, Inc.'
                        organizationUrl = 'https://www.convex.dev/'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/kenrick/convex-mobile.git'
                    url = 'https://github.com/kenrick/convex-mobile/tree/harby/0.8.1-patched'
                }
            }

            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        // The Maven repository committed in this fork, which apps resolve by commit-pinned URL.
        maven {
            name = 'forkRepo'
            url = rootProject.layout.projectDirectory.dir('../maven')
        }
        maven {
            name = 'zipRepo'
            url = layout.buildDirectory.dir('repo')
        }
    }
}

signing {
    // Signs only when a signatory is configured (upstream's Maven Central releases).
    required = false
    sign publishing.publications
}

dependencies {
    // Flow and kotlinx.serialization types are part of this library's API, and its inline functions
    // compile into the caller.
    api libs.kotlinx.coroutines.core
    api libs.kotlinx.serialization.json
    // Have to use string dependency reference for JNA due to https://github.com/gradle/gradle/issues/21267
    // The generated bindings expose JNA types (Pointer) in public signatures.
    api "net.java.dev.jna:jna:${libs.versions.jna.get()}@aar"
    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation(libs.strikt.core)
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.kotlinx.coroutines.test
}


task convexLocalBackend {
    doFirst {
        println("Launching Convex backend")
        ext.process = new ProcessBuilder()
                .directory(projectDir)
                .command("convex-local-backend")
                .start()
    }
}

task stopConvexLocalBackend {
    doFirst {
        println("Stopping Convex backend")
        if (tasks.convexLocalBackend.process != null) {
            tasks.convexLocalBackend.process.destroy()
        }
    }
}
